# pavfand configuration. Every key is optional; the values shown are the defaults.
# The daemon must be restarted to pick up changes: systemctl restart pavfand
#
# The mode chosen at runtime (tray, `pavfan set`) is remembered in /var/lib/pavfan
# and wins over default_mode after the first change.

# default_mode = "auto"          # off | auto | fixed | manual
# fixed_percent = 50             # FIXED mode target, percent of the EC's fan range
# interval_ms = 1000             # control loop period (250..10000)
# manual_curve = "/etc/pavfan/curve.toml"

# [thresholds]
# Decisions use the "effective" temperature max(CPU, GPU + gpu_bias_c). The GPU is
# weighted up because the BIOS ignores GPU heat and the GPU fan is the one the
# EC setpoint really drives (see docs/thermal-measurements.md).
# engage_c = 68                  # AUTO takes over from the BIOS at/above this
# disengage_c = 62               # ...and hands back at/below this
# gpu_bias_c = 8                 # -20..20
# hard_c = 88                    # maximum fans at/above this, in every mode but OFF (max 90)
# Timing (seconds). AUTO takes over only after the temperature has STAYED above
# engage_c, then holds for a minimum time and releases only after a quiet period,
# so a short load spike does not cause a few-second fan burst.
# engage_delay_s = 5
# release_delay_s = 10
# min_engaged_s = 30
