<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- pavfand bus policy.
     Anyone may read the status; changing the fan mode is limited to administrators
     (wheel / sudo) and members of the "pavfan" group (created at install). -->
<busconfig>
  <policy user="root">
    <allow own="org.pavfan.Daemon1"/>
    <allow send_destination="org.pavfan.Daemon1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.pavfan.Daemon1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.pavfan.Daemon1" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.pavfan.Daemon1" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.pavfan.Daemon1" send_interface="org.pavfan.Daemon1" send_member="GetStatus"/>
    <allow send_destination="org.pavfan.Daemon1" send_interface="org.pavfan.Daemon1" send_member="GetManualCurve"/>
    <allow receive_sender="org.pavfan.Daemon1"/>
  </policy>

  <policy group="wheel">
    <allow send_destination="org.pavfan.Daemon1"/>
  </policy>
  <policy group="sudo">
    <allow send_destination="org.pavfan.Daemon1"/>
  </policy>
  <policy group="pavfan">
    <allow send_destination="org.pavfan.Daemon1"/>
  </policy>
</busconfig>
