[package]
name = "pavfand"
description = "pavfan daemon: controls the fans of the HP Pavilion Gaming 15-dk1xxx under systemd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
pavfan-core = { path = "../pavfan-core" }
pavfan-ipc = { path = "../pavfan-ipc" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
toml = "1"
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }

[lints]
workspace = true
